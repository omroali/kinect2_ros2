# Generic Recording Pipeline Configuration
# ═══════════════════════════════════════════════════════════════════════════════
#
# This configuration is shared across all recording launch files.
# Customize it for your sensor and recording requirements.
#
# For sensor-specific settings (topic names, calibration), create a
# sensor_config.yaml in your sensor package and reference it from your launch.

recording_settings:
  output_root: "/home/ubuntu/data"
  uuid: "0000"

  # ─────────────────────────────────────────────────────────────────────────
  # H.264/H.265 Video Codec Settings for Colour Streams
  # ─────────────────────────────────────────────────────────────────────────

  # Video encoder to use for colour streams.
  # Options:
  #   libx265  — CPU-based, works everywhere, slower (default)
  #   hevc_nvenc — Nvidia GPU encoder, fast
  #   hevc_qsv  — Intel GPU encoder
  #   hevc_amf  — AMD GPU encoder
  video_encoder: "hevc_nvenc"

  # Constant Rate Factor for video encoding (quality vs file size)
  # Range: 0-51 (H.265) where lower = better quality, higher = smaller file
  # Practical range: 18-28
  #   18 — visually lossless, ~500-800 KB/s per stream
  #   22 — high quality, ~300-400 KB/s per stream
  #   28 — good quality (default), ~150-200 KB/s per stream
  #   35 — lower quality, ~50-100 KB/s per stream
  video_crf: 18

  # Video output frame rate (frames per second written to the .mp4 container).
  # Should match the actual sensor publication rate. Common values: 30.0, 60.0
  video_fps: 30.0

  # ─────────────────────────────────────────────────────────────────────────
  # Rosbag Storage Settings for Depth/Metadata
  # ─────────────────────────────────────────────────────────────────────────

  # Rosbag storage format. Options:
  #   mcap — Modern, efficient format (recommended)
  #   sqlite3 — Traditional ROS 2 bag format
  bag_storage: "mcap"

  # Bag-level zstd compression. Options:
  #   none    - no compression
  #   file    - outer zstd wrapper (.mcap.zstd). Best ratio, but the whole
  #             file must be sequentially decompressed for ANY read.
  #   message - chunk-level zstd inside a regular .mcap. Slightly worse
  #             ratio, but mcap's index still works for time-range/topic
  #             queries. Use this for downstream analysis workflows.
  # Depth frames arrive already PNG-compressed by kinect2_bridge (use_png),
  # so zstd mainly helps camera_info/tf and any raw topics in the bag.
  bag_compression: "message"

  # In-memory cache size per bag recorder process (megabytes).
  # Data is buffered in RAM before flushing to disk. A larger cache
  # protects against dropped messages during HDD latency spikes.
  #   Per-camera depth rate ≈ 0.57 MB/s  →  128 MB ≈ 225 sec headroom
  #   Set higher (256–512) for slower drives; lower (64) if RAM is tight.
  bag_cache_size_mb: 128
